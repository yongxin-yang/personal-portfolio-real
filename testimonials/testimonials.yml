# testimonials.yml - List of client testimonials
# Structure:
# testimonials:
#   - id: Unique identifier
#     name: Reviewer name
#     title: Reviewer role/company
#     avatar: Path to reviewer avatar (relative to File/ root)
#     text: Short testimonial text (or use textFile for Markdown)
#     textFile: Path to .md file for long testimonial (relative to File/ root)
testimonials:
  - id: t001
    name: 张三           # 宣言人名字
    title: 前同事       # 身份或公司
    avatar: testimonials/avatars/zhangsan.png  # 头像略缩图路径 (JPG/PNG)
    text: 阿斯蒂芬是一个好人
    # 两种存储方式：
    # 1. 直接存储短文本：
    # text: 张三的推荐文字...
    # 2. 存储为 Markdown 文件（适合较长的推荐文字）：
    # textFile: testimonials/t001.md