# projects.yml - List of portfolio projects
# Structure:
# projects:
#   - id: Unique identifier
#     title: Project name
#     category: Project category (matches titles in services.yml)
#     summary: Short one-line summary
#     cover: Path to cover image (relative to File/ root)
#     descriptionFile: Path to .md file for detailed description (relative to File/ root)
#     links:
#       demo: URL to live demo
#       github: URL to repository
#       [any_other]: URL
#     attachments:
#       - name: Display name of the file
#         path: Path to file (relative to File/ root)
projects:
  - id: project-001
    title: 有机液体六组分系统的定量分析：不同算法,溶质,预处理方法以及是否重复多次测量对预测结果的影响
    category: Machine Learning             # 项目分类：Web, Mobile, Backend, Design 等
    summary: 科学机器学习(Scientific Machine Learning),处理真实物理实验数据（光谱方向），整理数据，清洗数据，处理，建模并统计回归。
    cover: projects/project-001/cover.png  # 例如: cover.jpg, cover.png, thumbnail.webp
    links:
      paper: https://example.com/paper.pdf
      demo: https://example.com/demo
      repo: https://github.com/yongxin-yang/spectrum-process-data-Speckit
    attachments:               # 附件清单（可选）
      - name: paper.pdf
        path: projects/project-001/paper.pdf
      - name: product-poster.png
        path: projects/project-001/product-poster.png
    descriptionFile: projects/project-001/description.md  # 需为 Markdown 正文，触发初次存储时批量导入
  
